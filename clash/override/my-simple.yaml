    filter: ^(?=.*(.))(?!.*((?i)zhanwei|群|邀请|返利|循环|官网|官網|用户|重置|套餐|客服|网站|网址|获取|刷新|订阅|剩余|过滤|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|WIKI|USE|USED|TOTAL|EXPIRE|Traffic|EMAIL|Panel)).*$
