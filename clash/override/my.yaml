proxy-groups:
  - name: 全球加速
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/loganoxo/Qure/master/IconSet/Color/Global.png
    type: select
    proxies:
      - 自动选择
      - 手动切换
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 美国节点
      - 韩国节点
      - DIRECT
      - REJECT
  - name: 手动切换
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/loganoxo/Qure/master/IconSet/Color/Available.png
    include-all: true
    filter: ^(?=.*(.))(?!.*((?i)zhanwei|群|邀请|返利|循环|官网|官網|用户|重置|套餐|客服|网站|网址|获取|刷新|订阅|剩余|过滤|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|WIKI|USE|USED|TOTAL|EXPIRE|Traffic|EMAIL|Panel)).*$
    type: select
  - name: 自动选择
    icon: https://gh-proxy.com/https://raw.githubusercontent.com/loganoxo/Qure/master/IconSet/Color/Bypass.png
    type: url-test
